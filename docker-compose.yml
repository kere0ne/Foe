services:
  ollama:
    image: ollama/ollama:latest
    restart: unless-stopped
    volumes:
      - ollama_models:/root/.ollama

  ollama-init:
    image: ollama/ollama:latest
    depends_on:
      - ollama
    environment:
      OLLAMA_HOST: http://ollama:11434
      OLLAMA_MODEL: ${OLLAMA_MODEL:-qwen2.5-coder:7b}
    entrypoint: ["/bin/sh", "-c"]
    command: ["until ollama list >/dev/null 2>&1; do sleep 2; done; ollama pull \"$$OLLAMA_MODEL\""]
    restart: "no"

  app:
    build: .
    depends_on:
      ollama-init:
        condition: service_completed_successfully
    ports:
      - "${FOE_PORT:-8000}:8000"
    environment:
      FOE_DATA_DIR: /data
      AI_PROVIDER: ollama
      AI_FALLBACK_PROVIDERS: ""
      OLLAMA_BASE_URL: http://ollama:11434
      OLLAMA_MODEL: ${OLLAMA_MODEL:-qwen2.5-coder:7b}
      FOE_ALLOW_HOST_COMMANDS: "false"
    volumes:
      - foe_data:/data
      - /var/run/docker.sock:/var/run/docker.sock

volumes:
  foe_data:
  ollama_models:

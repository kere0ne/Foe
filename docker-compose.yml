services:
  app:
    build: .
    ports:
      - "8000:8000"
    environment:
      FOE_DATA_DIR: /data
      OLLAMA_BASE_URL: http://host.docker.internal:11434
      OLLAMA_MODEL: qwen2.5-coder:7b
      FOE_ALLOW_HOST_COMMANDS: "false"
    volumes:
      - foe_data:/data
      - /var/run/docker.sock:/var/run/docker.sock
volumes:
  foe_data:
